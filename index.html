<head>
  <script>
    (function(){
      try{
        var s=localStorage.getItem("toc-theme");
        var d=s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
        if(d)document.documentElement.classList.add("dark");
      }catch(e){}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>TheOfflineCo — Find your people</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="src/assets/logo.png" />

  <!-- Description -->
  <meta name="description" content="Find your people. Not online. In real life. Get matched with a group that actually feels like you." />

  <!-- Open Graph (for WhatsApp / Instagram preview) -->
  <meta property="og:title" content="TheOfflineCo — Find your people" />
  <meta property="og:description" content="Answer a few questions and get matched with your real-life social group." />
  <meta property="og:image" content="/preview.png" />
  <meta property="og:type" content="website" />

  <!-- Twitter (optional but good) -->
  <meta name="twitter:card" content="summary_large_image" />
</head>
